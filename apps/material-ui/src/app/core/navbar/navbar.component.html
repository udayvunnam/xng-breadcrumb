<mat-toolbar class="demo-toolbar" role="navigation" aria-label="Demo navigation">
  <a mat-button [routerLink]="['/']" class="brand-link" aria-label="xng-breadcrumb home">
    <span class="brand-copy">
      <span class="brand-title">xng-breadcrumb</span>
      <span class="brand-subtitle">Angular Demo</span>
    </span>
  </a>

  <div class="main-links">
    <a mat-button [routerLink]="['/dashboard']">Dashboard</a>
    <a mat-button [routerLink]="['/mentor']" [queryParams]="{ viaNav: 'true', type: 'list' }" fragment="testFragment">Mentors</a>
    <a mat-button [routerLink]="['/mentee']" [queryParams]="{ viaNav: 'true' }">Mentees</a>
    <a mat-button [routerLink]="['/connect']" [queryParams]="{ viaNav: 'true', loggedIn: 'false' }">Connect</a>
  </div>

  <div class="flex-1"></div>

  <div class="meta-actions">
    <button mat-icon-button matTooltip="Toggle theme" (click)="toggleTheme()" aria-label="Toggle theme">
      @if (theme === 'light') {
      <mat-icon>dark_mode</mat-icon>
      } @if (theme === 'dark') {
      <mat-icon>light_mode</mat-icon>
      }
    </button>

    <a
      mat-icon-button
      href="https://twitter.com/udayvunnam_"
      target="_blank"
      rel="noopener noreferrer"
      matTooltip="Twitter"
      aria-label="Open Twitter"
    >
      <img alt="Twitter" class="social-logo" src="../../../assets/img/twitter.svg" />
    </a>

    <a
      mat-icon-button
      href="https://github.com/udayvunnam/xng-breadcrumb"
      target="_blank"
      rel="noopener noreferrer"
      matTooltip="GitHub"
      aria-label="Open GitHub"
    >
      <img alt="GitHub" class="social-logo" src="../../../assets/img/github.svg" />
    </a>
  </div>
</mat-toolbar>
